server:
  port: 8389

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${INVENTORY_DB_URL:jdbc:mysql://localhost:3306/e_commerce_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: inventory-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      max-poll-records: 100
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "orderEvent:com.smartmart.inventory_service.dto.OrderEventDto,paymentEvent:com.smartmart.inventory_service.dto.PaymentDto"

logging:
  level:
    com.smartmart.inventoryservice: DEBUG

eureka:
  instance:
    prefer-ip-address: true