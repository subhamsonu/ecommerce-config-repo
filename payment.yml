# payment-service.yml

server:
  port: 8122

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/e_commerce_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      max-poll-records: 100

      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "orderEvent:com.smartmart.paymentservice.dto.OrderEventDto"

  web:
    error:
      include-message: always
      include-binding-errors: always

logging:
  level:
    com.smartmart.paymentservice: DEBUG

  file:
    name: logs/payment-service.log